format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$character"""

[directory]
style = "#7fbbb3"

[character]
success_symbol = "[>](bold #a7c080)"
error_symbol = "[x](bold #e67e80)"
vimcmd_symbol = "[<](bold #7fbbb3)"

[git_branch]
format = "[$branch]($style)"
style = "#859289"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](#dbbc7f) ($ahead_behind$stashed)]($style)"
style = "#7fbbb3"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "#859289"

[cmd_duration]
format = "[$duration]($style) "
style = "#dbbc7f"
